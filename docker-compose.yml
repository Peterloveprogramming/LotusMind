version: "3.9"
services:
  postgres:
    image: postgres:17-alpine
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=meditation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d meditation"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUN_DB_MIGRATION=true
      - DB_SOURCE=postgresql://root:secret@postgres:5432/meditation?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
