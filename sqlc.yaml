version: "1"
packages:
  - engine: "postgresql"
    name: "db"
    path: "./db/sqlc/"
    queries: "./db/query/"
    schema: "./db/migration"
    emit_json_tags: true
    emit_prepared_queries: false
    emit_interface: false
    # if false, this will be singular 
    emit_exact_table_names: false
    emit_empty_slices: true