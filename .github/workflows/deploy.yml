name: Deploy to production

on:
  push:
    branches: ["main", "develop", "lambda-c"]

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_ACCESS_ACCESS_KEY}}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Load Secrets and save to app.env
        run: aws secretsmanager get-secret-value --secret-id ommind --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > app.env

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ommind
          # Pass the raw components needed for the tag
          GIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Get the current date
          CURRENT_DATE=$(date +'%Y%m%d')

          # Sanitize the branch name (replace '/' with '-')
          # You might need more complex sanitization depending on possible branch names
          SANITIZED_BRANCH_NAME=$(echo "${BRANCH_NAME}" | sed 's|/|-|g')

          # Use a short SHA for brevity (e.g., first 7 characters)
          SHORT_SHA="${GIT_SHA::7}"

          # Construct the final tag using hyphens (or underscores)
          IMAGE_TAG="${SHORT_SHA}-${CURRENT_DATE}-${SANITIZED_BRANCH_NAME}"

          echo "Building image with tag: $IMAGE_TAG"
          # Use the constructed tag in the docker build command
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "Pushing image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # Use the constructed tag in the docker push command
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
